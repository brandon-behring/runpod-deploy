[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runpod-deploy"
version = "0.7.4"
description = "Config-driven RunPod orchestration for reusable GPU project deployments."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Brandon Behring" }]
keywords = ["runpod", "gpu", "deployment", "orchestration", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/brandon-behring/runpod-deploy"
Source = "https://github.com/brandon-behring/runpod-deploy"
Issues = "https://github.com/brandon-behring/runpod-deploy/issues"
Changelog = "https://github.com/brandon-behring/runpod-deploy/blob/main/CHANGELOG.md"
Documentation = "https://github.com/brandon-behring/runpod-deploy/blob/main/docs/lifecycle.md"
Releases = "https://github.com/brandon-behring/runpod-deploy/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "black>=26.0",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
runpod-deploy = "runpod_deploy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/runpod_deploy"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/docker",
    "README.md",
    "STYLE.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# ARG002 (unused method argument): in tests, fixture args appear unused
# until pytest injects them at collect time; common pattern in conftest
# autouse fixtures + monkeypatch helpers. Test signatures should stay
# expressive.
"tests/**/*.py" = ["ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["runpod_deploy"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "unit: Pure contract tests",
    "smoke: End-to-end dry-run tests",
    "network: Live RunPod tests; excluded from default use",
    "golden: Golden-file CLI snapshot tests; regenerate via --update-goldens",
]

[tool.coverage.run]
source = ["src/runpod_deploy"]
branch = true

[tool.coverage.report]
fail_under = 82
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
