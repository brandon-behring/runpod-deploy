schema_version: 2
name: a4000-smoke
run_id_prefix: smoke
state_file: ~/.runpod-smoke-current

local:
  project_root: .
  required_paths:
    - payload/hello.txt

variables:
  smoke_dir: /workspace/{run_id}

pod:
  image: runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04
  datacenters: [EU-RO-1]
  gpu_order:
    - NVIDIA RTX A4000
    - NVIDIA RTX A4500
    - NVIDIA RTX 4000 Ada Generation
    - NVIDIA RTX 2000 Ada Generation
    - NVIDIA GeForce RTX 5090
    - NVIDIA A100 80GB PCIe

storage:
  mode: network_volume
  volume_name: pid-workspace-100gb
  volume_mount: /workspace

ssh:
  key_path: ~/.ssh/id_ed25519

budget:
  cost_cap_usd: 0.50
  assumed_hourly_rate_usd: 1.65
  poll_interval_sec: 30

setup:
  - command: "which rsync >/dev/null 2>&1 || { apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq rsync ; }"
    timeout_sec: 300
  - command: "mkdir -p {smoke_dir}"
    timeout_sec: 30

staging:
  - label: payload
    source: "{project_root}/payload/"
    destination: "{smoke_dir}/payload/"

run:
  script_path: /workspace/smoke-current.sh
  log_path: /workspace/smoke-current.log
  success_marker: "[smoke] DONE"
  body: |
    #!/usr/bin/env bash
    set -euo pipefail
    echo "[smoke] START $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    nvidia-smi > {smoke_dir}/gpu_info.txt
    nvidia-smi -L >> {smoke_dir}/gpu_info.txt
    cat {smoke_dir}/payload/hello.txt >> {smoke_dir}/gpu_info.txt
    echo "[smoke] DONE $(date -u +%Y-%m-%dT%H:%M:%SZ)"

artifacts:
  - label: gpu-info
    remote_path: "{smoke_dir}/gpu_info.txt"
    local_path: "{run_dir}"
    required: true
    delete: false
  - label: log
    remote_path: /workspace/smoke-current.log
    local_path: "{run_dir}"
    required: false
    delete: false

lifecycle:
  on_success: delete
  on_failure: stop
