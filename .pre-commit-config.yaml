repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
        # Catches accidental commits of large files (datasets, model weights,
        # build artifacts). 500KB ceiling is generous for source repos; bump
        # via `--maxkb=N` if a legitimate large file (e.g., a binary fixture)
        # is needed.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        args: [--fix]
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        language_version: python3.13
  - repo: local
    hooks:
      # mypy runs at pre-push (NOT pre-commit) so commit cycles stay
      # fast. Uses the exact venv-pinned mypy via `make lint` style
      # invocation; no version drift between pre-commit and CI.
      - id: mypy
        name: mypy
        entry: .venv/bin/python -m mypy
        args: [src]
        language: system
        types: [python]
        stages: [pre-push]
        pass_filenames: false
