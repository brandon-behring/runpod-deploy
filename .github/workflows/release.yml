name: release

# Trigger on tag push only (e.g., `git tag v0.7.1 && git push origin v0.7.1`).
# Builds sdist + wheel via hatchling, publishes to PyPI via Trusted Publishing.
#
# One-time PyPI setup (per `docs/release.md`): add a "pending publisher" on
# https://pypi.org/manage/account/publishing/ pointing at this repo + this
# workflow filename + the `pypi` environment below. Until that's configured,
# the `publish-to-pypi` job fails gracefully with a clear PyPI-side error;
# the `build` job still succeeds and the artifacts are downloadable from the
# workflow run page.

on:
  push:
    tags:
      - "v*"

permissions:
  # `pypa/gh-action-pypi-publish@release/v1` needs `id-token: write` for
  # OIDC-based Trusted Publishing (no secrets required). Read-only for
  # everything else; minimum-privilege principle.
  contents: read
  id-token: write

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv --python 3.13

      - name: Install build backend
        run: uv pip install build

      - name: Build sdist + wheel
        run: uv run python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-to-pypi:
    name: Publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs: build
    # `environment: pypi` is required by PyPI's Trusted Publishing matcher.
    # Configure the matching publisher under
    # https://pypi.org/manage/project/runpod-deploy/settings/publishing/
    # once the package is claimed; see docs/release.md.
    environment:
      name: pypi
      url: https://pypi.org/p/runpod-deploy
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Default repository URL is pypi.org. Override to test.pypi.org
          # by uncommenting the next line during workflow iteration:
          # repository-url: https://test.pypi.org/legacy/
