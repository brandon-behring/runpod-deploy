name: Deploy docs

# Builds + deploys the Sphinx + pydata-sphinx-theme site to GitHub Pages
# on every push to main and on tag pushes. Single-version (no
# sphinx-multiversion) per the v0.8.0 plan; Phase 1 (v0.7.8) shipped the
# infrastructure, Phase 2 (v0.7.9) added the per-module autodoc API, and
# this Phase 3 workflow takes the site live at
# https://brandon-behring.github.io/runpod-deploy/.
#
# One-time setup required at repo level:
#   Settings → Pages → Source: "GitHub Actions"
# Without that, the deploy step fails with "Pages site not yet created".

on:
  push:
    branches: [main]
    # NOTE: deliberately NOT triggered on tag pushes. The GitHub-Pages
    # environment's default "deployment branches" rule only allows
    # deploys from `main`, so a tag push (e.g. `v0.8.0`) fails the
    # deploy step. Every tag we push points at a commit that is
    # already on main — so the main-branch push has already deployed
    # the same content. Removing the tag trigger eliminates the
    # spurious "failed deploy" run that would otherwise show up in
    # the Actions tab on every release tag.
  pull_request:
    branches: [main]
    # PR builds run the `build` job only — `deploy` is gated by an
    # `if:` condition below. Catches PRs that break the docs build
    # before they merge (replaces the build-only `docs` job that lived
    # in test.yml during Phase 1+2).
  workflow_dispatch:  # manual trigger for ad-hoc rebuilds

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent docs deployment, but queue subsequent runs so
# the latest push always wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv venv --python 3.13

      - name: Install package + docs extras
        # `[docs]` is the canonical install for this job; the base
        # package is enough for autosummary to import every public module
        # (runpod-deploy has no [all] extra, unlike eval-toolkit).
        run: uv pip install -e ".[docs]"

      - name: Build Sphinx site (two-pass; autosummary writes stubs on pass 1)
        # Pass 1 generates autosummary stub pages under
        # docs/source/api/generated/ (gitignored). Pass 2 is the strict
        # gate — by then every :toctree: reference resolves, so -W can
        # surface real warnings without false-positives on freshly-
        # generated stubs. Mirrors the same two-pass logic in `make docs`.
        run: |
          uv run sphinx-build -b html docs/source/ docs/build/html/
          uv run sphinx-build -b html -W --keep-going docs/source/ docs/build/html/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    # Deploy only from main pushes. PR builds run `build` to gate
    # doc-breaking changes but must NOT publish (PR head SHAs are
    # untrusted from a Pages-permissions standpoint). Tag pushes are
    # not triggered at all (see top-level `on:` comment).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
