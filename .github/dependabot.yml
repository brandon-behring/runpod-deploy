version: 2

# Weekly grouped dependency updates. Minor + patch updates batch into a
# single PR per ecosystem to keep review noise low; major updates land
# individually so they get explicit attention.
#
# Reviews land on Mondays so they're top-of-week and don't pile up.

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # Constrain major-version bumps of release-pipeline-critical actions
    # to manual review. These actions touch the publish path (checkout +
    # artifact upload/download); major bumps can change behavior (e.g.,
    # download-artifact v5's by-ID path semantics) or runtime
    # (node20 → node24). Dependabot still files minor + patch updates
    # automatically via the group above.
    ignore:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/upload-artifact"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/download-artifact"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "ci"
      include: "scope"
